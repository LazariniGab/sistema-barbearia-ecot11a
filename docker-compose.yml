version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: barbearia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: barbearia
      POSTGRES_PASSWORD: barbearia123
      POSTGRES_DB: barbearia_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

name: CI - Testes e Build (Sistema Barbearia)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências (Root, Backend e Frontend)
        run: npm run install:all

      - name: Preparar Banco de Dados Prisma e Seed
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci-secret-ecot11a"
        run: npm run db:setup

      - name: Executar Plano de Testes Automatizados (CT01 a CT14)
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci-secret-ecot11a"
        run: npm test

      - name: Build de Produção do Frontend (React + Vite)
        run: npm run build
